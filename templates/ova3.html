<!DOCTYPE html>
<html>
<head>
    <title>Taiyaki War! - Theater</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #0b0b0e; color: white;">

<div class="page" style="max-width: 1200px; margin: auto; padding: 20px;">
    
    <nav style="margin-bottom: 20px;">
        <a href="/theater" style="color:var(--primary-pink); text-decoration: none; font-weight: bold;">← Back to Theater</a>
    </nav>

    <header style="margin-bottom: 30px;">
        <h1 style="color: var(--primary-pink); text-align: left;">Das Finale: Taiyaki War!</h1>
    </header>

    <div class="watch-container" style="display: grid; grid-template-columns: 1fr 350px; gap: 30px;">
        
        <div class="video-player-section">
            <div class="video-wrapper" style="width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--primary-pink); border-radius: 10px; overflow: hidden;">
                <video controls style="width: 100%; height: 100%;">
                    <source src="{{ url_for('static', filename='videos/ova_taiyaki.mp4') }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <h2 style="margin-top: 20px; color: var(--primary-pink);">Now Playing: Taiyaki War</h2>
            <p style="color: #aaa; font-size: 1.1em;">Discover the culinary conflict and internal politics inside BC Freedom Academy.</p>
        </div>

        <div class="episode-sidebar" style="background: #16161d; padding: 20px; border-radius: 15px; border: 1px solid rgba(255, 133, 161, 0.2); height: fit-content;">
            <h3 style="border-bottom: 2px solid var(--accent-magenta); padding-bottom: 10px; margin-bottom: 15px;">Information</h3>
            <div class="info-list" style="margin-top: 15px;">
                <p style="margin-bottom: 10px;"><b style="color: var(--primary-pink);">Format:</b> Special</p>
                <p style="margin-bottom: 10px;"><b style="color: var(--primary-pink);">School:</b> BC Freedom Academy</p>
                <p style="margin-bottom: 10px;"><b style="color: var(--primary-pink);">Commander:</b> Marie</p>
                <p style="margin-bottom: 10px;"><b style="color: var(--primary-pink);">Runtime:</b> 12 Minutes</p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
