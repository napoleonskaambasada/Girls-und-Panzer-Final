<!DOCTYPE html>
<html>
<head>
    <title>Der Film - Theater</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #0b0b0e; color: white;">

<div class="page" style="max-width: 1200px; margin: auto; padding: 20px;">
    
    <nav style="margin-bottom: 20px;">
        <a href="/theater" style="color:var(--primary-pink); text-decoration: none; font-weight: bold;">← Back to Theater</a>
    </nav>

    <header style="margin-bottom: 30px; border-bottom: 2px solid var(--accent-magenta); padding-bottom: 10px;">
        <h1 style="color: var(--primary-pink); text-align: left; margin: 0;">Girls und Panzer der Film</h1>
    </header>

    <div class="movie-container">
        <div class="video-wrapper" style="width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--primary-pink); border-radius: 15px; overflow: hidden; box-shadow: 0 0 30px rgba(255, 133, 161, 0.2);">
            <video controls style="width: 100%; height: 100%;">
                <source src="{{ url_for('static', filename='videos/' + movie.file) }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <div style="margin-top: 30px; background: #16161d; padding: 30px; border-radius: 15px; border: 1px solid rgba(255, 133, 161, 0.2);">
            <h2 style="color: var(--primary-pink); margin-top: 0; border: none; padding: 0;">Synopsis</h2>
            <p style="color: #eee; font-size: 1.2em; line-height: 1.8;">{{ movie.desc }}</p>
            
            <div style="margin-top: 20px; display: flex; gap: 40px; color: #aaa;">
                <span><b style="color: var(--primary-pink);">Duration:</b> 2h 00m</span>
                <span><b style="color: var(--primary-pink);">Type:</b> Theatrical Feature</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
