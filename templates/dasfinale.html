<!DOCTYPE html>
<html>
<head>
    <title>Das Finale - Theater</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #0b0b0e; color: white;">

<div class="page" style="max-width: 1200px; margin: auto; padding: 20px;">
    
    <nav style="margin-bottom: 20px;">
        <a href="/theater" style="color:var(--primary-pink); text-decoration: none; font-weight: bold;">← Back to Theater</a>
    </nav>

    <header style="margin-bottom: 30px;">
        <h1 style="color: var(--primary-pink); text-align: left;">Girls und Panzer: das Finale</h1>
    </header>

    <div class="watch-container" style="display: grid; grid-template-columns: 1fr 350px; gap: 30px;">
        
        <div class="video-player-section">
            <div class="video-wrapper" style="width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--primary-pink); border-radius: 10px; overflow: hidden;">
                <video id="main-player" controls style="width: 100%; height: 100%;">
                    <source id="video-source" src="{{ url_for('static', filename='videos/' + episodes[0].file) }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            
            <h2 id="now-playing-title" style="margin-top: 20px; color: var(--primary-pink);">Now Playing: {{ episodes[0].title }}</h2>
            <p id="now-playing-desc" style="color: #aaa; font-size: 1.1em;">{{ episodes[0].desc }}</p>
        </div>

        <div class="episode-sidebar" style="background: #16161d; padding: 20px; border-radius: 15px; border: 1px solid rgba(255, 133, 161, 0.2); height: fit-content;">
            <h3 style="border-bottom: 2px solid var(--accent-magenta); padding-bottom: 10px; margin-bottom: 15px;">Movie Parts</h3>
            <div class="ep-list">
                {% for ep in episodes %}
                <a href="javascript:void(0);" 
                   class="ep-item"
                   data-file="{{ url_for('static', filename='videos/' + ep.file) }}" 
                   data-title="{{ ep.title }}"
                   data-desc="{{ ep.desc }}"
                   style="display: block; padding: 15px; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 10px; background: #222; transition: 0.3s;">
                    <b style="color: var(--primary-pink);">{{ ep.title }}</b>
                </a>
                {% endfor %}
            </div>
        </div>

    </div>
</div>

<script>
    const epLinks = document.querySelectorAll('.ep-item');
    const player = document.getElementById('main-player');
    const titleDisplay = document.getElementById('now-playing-title');
    const descDisplay = document.getElementById('now-playing-desc');

    epLinks.forEach(link => {
        link.addEventListener('click', function() {
            const filePath = this.getAttribute('data-file');
            const title = this.getAttribute('data-title');
            const desc = this.getAttribute('data-desc');

            player.src = filePath;
            player.load();
            player.play();

            titleDisplay.innerText = `Now Playing: ${title}`;
            descDisplay.innerText = desc;

            // Sidebar highlighting
            epLinks.forEach(l => {
                l.style.background = '#222';
                l.style.borderLeft = 'none';
            });
            this.style.background = '#ff85a133';
            this.style.borderLeft = '4px solid #ff85a1';
        });
    });
</script>

</body>
</html>
