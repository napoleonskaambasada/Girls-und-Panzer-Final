<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Theater</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #0b0b0e; color: white;">

<div class="page" style="max-width: 1200px; margin: auto; padding: 20px;">
    
    <nav style="margin-bottom: 20px;">
        <a href="/theater" style="color:var(--primary-pink); text-decoration: none; font-weight: bold; transition: 0.3s;" onmouseover="this.style.color='#ef476f'" onmouseout="this.style.color='var(--primary-pink)'">
            ← Back to Theater
        </a>
    </nav>

    <header style="margin-bottom: 30px; border-left: 8px solid var(--accent-magenta); padding-left: 20px;">
        <h1 style="color: var(--primary-pink); text-align: left; margin: 0; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px;">
            {{ title }}
        </h1>
        <p style="color: #888; margin: 5px 0 0 0; font-weight: bold;">Girls und Panzer: das Finale Special</p>
    </header>

    <div class="watch-container" style="display: grid; grid-template-columns: 1fr 350px; gap: 30px;">
        
        <div class="video-player-section">
            <div class="video-wrapper" style="width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--primary-pink); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <video controls style="width: 100%; height: 100%;">
                    <source src="{{ url_for('static', filename='videos/' + file) }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            
            <div style="margin-top: 25px; background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 10px;">
                <h2 style="margin-top: 0; color: var(--primary-pink); font-size: 1.5rem; border: none; padding: 0;">Synopsis</h2>
                <p style="color: #ccc; font-size: 1.1em; line-height: 1.7;">{{ desc }}</p>
            </div>
        </div>

        <div class="episode-sidebar" style="background: #16161d; padding: 25px; border-radius: 15px; border: 1px solid rgba(255, 133, 161, 0.2); height: fit-content;">
            <h3 style="border-bottom: 2px solid var(--accent-magenta); padding-bottom: 10px; margin-bottom: 20px; color: #fff;">Media Info</h3>
            <div class="info-list">
                <div style="margin-bottom: 15px;">
                    <span style="color: var(--primary-pink); display: block; font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Type</span>
                    <span style="color: white; font-size: 1.1rem;">OVA / Special</span>
                </div>
                <div style="margin-bottom: 15px;">
                    <span style="color: var(--primary-pink); display: block; font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Series Context</span>
                    <span style="color: white; font-size: 1.1rem;">Das Finale Part 3 Bundle</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
                <p style="font-size: 0.9rem; color: #777; font-style: italic; text-align: center;">Panzer Vor!</p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
